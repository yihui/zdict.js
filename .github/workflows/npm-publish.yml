name: Node.js Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
      - run: |
          sudo npm install -g npm@latest
          ./build.sh
          npm publish
